<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BikeRental</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🚲 BikeRental</h1>
    <nav>
      <button id="btn-catalog" class="active">Selaa pyöriä</button>
      <button id="btn-admin">Admin</button>
    </nav>
  </header>

  <main>
    <!-- Asiakasnäkymä -->
    <section id="catalog-view">
      <h2>Selaa pyöriä</h2>
      <p>Pyörät ja suodattimet tulevat tähän myöhemmin.</p>
    </section>

    <!-- Admin-näkymä (aluksi piilossa) -->
    <section id="admin-view" class="hidden">
      <h2>Ylläpito</h2>
      <p>Admin-toiminnot tulevat tähän myöhemmin.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
